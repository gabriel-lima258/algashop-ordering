spring:
  application:
    name: ordering
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
    locations: classpath:db/migration

algashop:
  integrations:
    shipping.provider: "RAPIDEX"

  # Politica de resiliencia das chamadas de saida (product-catalog e Rapidex).
  #
  # Estes valores ja eram os defaults do @Value no SpringCircuitBreakerConfig - explicita-los
  # aqui nao muda nada em runtime. O que muda e quem consegue enxerga-los: a politica que
  # governa producao estava escrita apenas dentro de um construtor Java, e quem opera o
  # servico nao tem por que abrir codigo para descobrir quanto tempo um circuito fica aberto.
  #
  # Os ITs sobrescrevem para milissegundos via @TestPropertySource - sem isso, um unico teste
  # de retry ficaria 21s parado no backoff.
  resilience:
    circuit-breaker:
      # tentativas ALEM da original: 3 retries = 4 idas no total
      max-retries: 3
      # espera antes da 1a retentativa; dobra a cada rodada (3s -> 6s -> 12s)
      delay: 3s
      multiplier: 2
      # quanto tempo o circuito fica aberto falhando rapido antes de testar HALF_OPEN
      open-timeout: 5s
      # tempo sem nenhuma falha que zera o estado do circuito
      reset-timeout: 30s