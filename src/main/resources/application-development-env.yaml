server.port: 8081

# config.import traz os secrets e parameters da aws (LocalStack) para este arquivo env.
# O seed é feito pelo etc/aws/init.sh (parameters.csv / secrets.csv).
# prefix facilita o uso: ${ordering.params.datasource.url}, ${ordering.secrets.datasource.username}

# ProductCatalog.ProductAddedIntegrationEvent:tools.jackson.databind.node.ObjectNode serializa em json generico
# já tratado automaticamente na classe KafkaConsumerTypeIdIdentifier

#  max.poll.interval.ms	300000 (5 min)	tempo máximo entre duas chamadas de poll() — estourou, o consumer é considerado em falha e sai do grupo
#  max.poll.records	500	quantos registros uma única chamada de poll() devolve
#  heartbeat.interval.ms 3s de quanto em quanto tempo a thread de fundo avisa que está viva

spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/ordering/database?prefix=ordering.secrets.datasource.
      - aws-secretsmanager:/secret/algashop/ordering/redis?prefix=ordering.secrets.redis.
      - aws-secretsmanager:/secret/algashop/ordering/oauth2-client?prefix=ordering.secrets.oauth2-client.
      - aws-parameterstore:/config/algashop/ordering?prefix=ordering.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
      credentials:
        access-key: LSIAQAAAAAAVNCBMPNSG
        secret-key: test
  cache:
    type: redis
  datasource:
    url: ${ordering.params.datasource.url}
    username: ${ordering.secrets.datasource.username}
    password: ${ordering.secrets.datasource.password}
  jpa:
    show-sql: ${ordering.params.jpa.show-sql}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/ordering
  data:
    redis:
      host: ${ordering.params.redis.host}
      port: ${ordering.params.redis.port}
      password: ${ordering.secrets.redis.password}
      database: ${ordering.params.redis.database}       # database 1 diferente do catalog 0 para separar os banco lógicos
      timeout: ${ordering.params.redis.timeout}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${algashop.integrations.authorization-server.url} # url de authorization server
      # O outro papel: aqui o ordering e CLIENT, e pede token para chamar o catalogo.
      client:
        provider:
          # token-uri, e NAO issuer-uri, e a decisao que desacopla a subida.
          #
          # Com issuer-uri, o Spring executa ClientRegistrations.fromIssuerLocation() na
          # CRIACAO DO BEAN: uma ida ao /.well-known do authorization server durante o
          # refresh do contexto. Se o AS nao estiver no ar, o ordering nao sobe - e o
          # sintoma e um servico que "nao inicia", sem relacao aparente com seguranca.
          #
          # Declarando token-uri, nao ha descoberta: o endereco ja e conhecido, e a
          # primeira ida a rede passa a ser a primeira requisicao que precisar de token.
          # O preco e perder a descoberta automatica dos demais endpoints - que este
          # fluxo nao usa, porque client_credentials so precisa do /oauth2/token.
          algashop-as:
            token-uri: ${algashop.integrations.authorization-server.url}/oauth2/token
        registration:
          algashop-ordering-service-client:
            provider: algashop-as
            client-id: algashop-ordering-service
            # Segredo vem do Secrets Manager - o par em texto puro do {bcrypt} registrado
            # no lado do authorization server (mesmo valor, representacoes diferentes).
            client-secret: ${ordering.secrets.oauth2-client.client-secret}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: products:read
  kafka:
    bootstrap-servers: algashop-kafka-1:9092,algashop-kafka-2:9093,algashop-kafka-3:9094
    properties:
      spring.json.type.mapping: # deserialização do type id do produtor
        ProductCatalog.ProductDelistedIntegrationEvent:com.gtech.algashop.core.application.product.event.ProductDelistedIntegrationEvent,
        ProductCatalog.ProductListedIntegrationEvent:com.gtech.algashop.core.application.product.event.ProductListedIntegrationEvent,
        ProductCatalog.ProductPriceChangedV2IntegrationEvent:com.gtech.algashop.core.application.product.event.ProductPriceChangedV2IntegrationEvent,
        Ordering.OrderPlacedIntegrationEvent:com.gtech.algashop.core.application.order.event.OrderPlacedIntegrationEvent,
        Ordering.ProcessAcceptedCheckoutIntegrationCommand:com.gtech.algashop.core.application.checkout.command.ProcessAcceptedCheckoutIntegrationCommand,
        Ordering.OrderPaidIntegrationEvent:com.gtech.algashop.core.application.order.event.OrderPaidIntegrationEvent,
        Ordering.OrderCanceledIntegrationEvent:com.gtech.algashop.core.application.order.event.OrderCanceledIntegrationEvent,
        Billing.InvoicePaidIntegrationEvent:com.gtech.algashop.core.application.invoice.event.InvoicePaidIntegrationEvent,
        Billing.InvoiceCanceledIntegrationEvent:com.gtech.algashop.core.application.invoice.event.InvoiceCanceledIntegrationEvent
    producer: # produtor para topico de dead letter topic
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # chave String
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer # valor Json
      properties:
        enable.idempotence: true
        linger.ms: 0 # tempo de batch de messages enviados no producer, 0 envia uma mensagem por vez
        request.timeout.ms: 5000 # tempo de UMA ida ao broker esperando a resposta
        delivery.timeout.ms: 5000 # teto da operação inteira: envio + retries + backoff + confirmação
        max.block.ms: 5000 # tempo que o próprio send() pode bloquear antes de existir future
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: ordering
      auto-offset-reset: earliest # grupo novo começa do início do tópico (não perde comandos já publicados)
      properties:
        max.poll.interval.ms: 300000 # (5 min) tempo máximo entre chamadas de consumo de eventos
        max.poll.records: 1
        heartbeat.interval.ms: 3000
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.gtech.algashop.* # define os pacotes seguros ao kafka para evitar erros
        spring.json.key.default.type: java.lang.String
        spring.json.value.default.type: java.lang.String
        spring.json.value.type.method: com.gtech.algashop.infrastructure.config.kafka.KafkaConsumerTypeIdIdentifier.readType

algashop:
  integrations:
    # Fonte unica do endereco do authorization server: o issuer-uri do resource server e o
    # token-uri do client interpolam daqui. Sao dois papeis diferentes lendo o mesmo valor -
    # e ter que muda-lo em dois lugares seria um jeito silencioso de deixa-los divergir.
    authorization-server.url: ${shared.params.auth-server-url}
    shipping.provider: "RAPIDEX"
    rapidex.url: ${ordering.params.integrations.rapidex.url}
    product-catalog:
      url: ${ordering.params.integrations.product-catalog.url}
      oauth2-client-registration-id: algashop-ordering-service-client
  messaging:
    kafka:
      product-event-topic-name: product-catalog.product.events
      order-event-topic-name: ordering.order.events
      order-command-topic-name: ordering.order.commands
      invoice-event-topic-name: billing.invoice.events
      product-events-consumer-group: ordering.product-events
      order-commands-consumer-group: ordering.order-commands
      invoice-events-consumer-group: ordering.invoice-events
    outbox:
      enabled: true # persistencia
      send-timeout: PT5S
      batch-size: 100 # quantidades de mensagens buscadas
      poll-interval: PT1M # intervalo de verificação na tabela de outbox
      max-attempts: 10 # maximas tentativas ao falhar
      backoff: PT5S # tempo entre tentativas
      batch-deadline: PT3M # tempo maximo que schedule de tentativa de envio pode ter e respeitar o lock
      dispatcher:
        enabled: true # envio

eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: true # habilita o health em eureka para status de serviço dentro de eureka
  instance:
    instanceId: ${random.uuid} # cada instancia replicada ganha um id unico
    prefer-ip-address: true # configura rede alcançável via docker

logging:
  level:
    com.netflix.discovery.DiscoveryClient: OFF # desativa error eureka em dev
    com.netflix.discovery: OFF
    com.netflix.eureka: OFF
    org.springframework.kafka: OFF
    org.apache.kafka: OFF