server.port: 8081

# config.import traz os secrets e parameters da aws (LocalStack) para este arquivo env.
# O seed é feito pelo etc/aws/init.sh (parameters.csv / secrets.csv).
# prefix facilita o uso: ${ordering.params.datasource.url}, ${ordering.secrets.datasource.username}

spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/ordering/database?prefix=ordering.secrets.datasource.
      - aws-secretsmanager:/secret/algashop/ordering/redis?prefix=ordering.secrets.redis.
      - aws-secretsmanager:/secret/algashop/ordering/oauth2-client?prefix=ordering.secrets.oauth2-client.
      - aws-parameterstore:/config/algashop/ordering?prefix=ordering.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
      credentials:
        access-key: LSIAQAAAAAAVNCBMPNSG
        secret-key: test
  cache:
    type: redis
  datasource:
    url: ${ordering.params.datasource.url}
    username: ${ordering.secrets.datasource.username}
    password: ${ordering.secrets.datasource.password}
  jpa:
    show-sql: ${ordering.params.jpa.show-sql}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/ordering
  data:
    redis:
      host: ${ordering.params.redis.host}
      port: ${ordering.params.redis.port}
      password: ${ordering.secrets.redis.password}
      database: ${ordering.params.redis.database}       # database 1 diferente do catalog 0 para separar os banco lógicos
      timeout: ${ordering.params.redis.timeout}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${algashop.integrations.authorization-server.url} # url de authorization server
      # O outro papel: aqui o ordering e CLIENT, e pede token para chamar o catalogo.
      client:
        provider:
          # token-uri, e NAO issuer-uri, e a decisao que desacopla a subida.
          #
          # Com issuer-uri, o Spring executa ClientRegistrations.fromIssuerLocation() na
          # CRIACAO DO BEAN: uma ida ao /.well-known do authorization server durante o
          # refresh do contexto. Se o AS nao estiver no ar, o ordering nao sobe - e o
          # sintoma e um servico que "nao inicia", sem relacao aparente com seguranca.
          #
          # Declarando token-uri, nao ha descoberta: o endereco ja e conhecido, e a
          # primeira ida a rede passa a ser a primeira requisicao que precisar de token.
          # O preco e perder a descoberta automatica dos demais endpoints - que este
          # fluxo nao usa, porque client_credentials so precisa do /oauth2/token.
          algashop-as:
            token-uri: ${algashop.integrations.authorization-server.url}/oauth2/token
        registration:
          algashop-ordering-service-client:
            provider: algashop-as
            client-id: algashop-ordering-service
            # Segredo vem do Secrets Manager - o par em texto puro do {bcrypt} registrado
            # no lado do authorization server (mesmo valor, representacoes diferentes).
            client-secret: ${ordering.secrets.oauth2-client.client-secret}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: products:read

logging:
  level:
    com.netflix.discovery.DiscoveryClient: OFF # desativa error eureka em dev
    com.netflix.discovery: OFF
    com.netflix.eureka: OFF

algashop:
  integrations:
    # Fonte unica do endereco do authorization server: o issuer-uri do resource server e o
    # token-uri do client interpolam daqui. Sao dois papeis diferentes lendo o mesmo valor -
    # e ter que muda-lo em dois lugares seria um jeito silencioso de deixa-los divergir.
    authorization-server.url: ${shared.params.auth-server-url}
    shipping.provider: "RAPIDEX"
    rapidex.url: ${ordering.params.integrations.rapidex.url}
    product-catalog:
      url: ${ordering.params.integrations.product-catalog.url}
      oauth2-client-registration-id: algashop-ordering-service-client

eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: true # habilita o health em eureka para status de serviço dentro de eureka
  instance:
    instanceId: ${random.uuid} # cada instancia replicada ganha um id unico
    prefer-ip-address: true # configura rede alcançável via docker