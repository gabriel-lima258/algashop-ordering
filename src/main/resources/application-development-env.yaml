server.port: 8081

spring:
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://localhost:5433/ordering
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/ordering
  data:
    redis:
      host: localhost
      port: 6379
      password: algashop
      database: 1       # database 1 diferente do catalog 0 para separar os banco lógicos
      timeout: 600

algashop:
  integrations:
    shipping.provider: "RAPIDEX"
    rapidex.url: "http://localhost:8787"
    product-catalog.url: "http://localhost:8083"