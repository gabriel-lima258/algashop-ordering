spring:
  datasource:
    url: jdbc:postgresql://algashop-postgres:5432/ordering
  jpa:
    show-sql: false
  # Dentro da rede do compose o Redis atende pelo nome do container. Sem isto o
  # perfil docker herda o localhost do development-env, e o cache sobe DEGRADED.
  # Senha, porta e database (1) continuam vindo de la.
  data:
    redis:
      host: algashop-redis
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    # 5432, nao 5433: 5433 e a porta PUBLICADA no host. Dentro da rede do compose
    # quem responde e a porta do container.
    url: jdbc:postgresql://algashop-postgres:5432/ordering

algashop:
  integrations:
    shipping.provider: "RAPIDEX"
    rapidex.url: "http://wiremock:8080"
    product-catalog.url: "http://algashop-product-catalog:8083"