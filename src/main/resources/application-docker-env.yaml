spring:
  datasource:
    url: jdbc:postgresql://algashop-postgres:5432/ordering
  jpa:
    show-sql: false
  # Dentro da rede do compose o Redis atende pelo nome do container. Sem isto o
  # perfil docker herda o localhost do development-env, e o cache sobe DEGRADED.
  # Senha, porta e database (1) continuam vindo de la.
  data:
    redis:
      host: algashop-redis
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    url: jdbc:postgresql://algashop-postgres:5432/ordering
  # Dentro da rede do compose o bootstrap e o listener PLAINTEXT interno (9090).
  # O development-env aponta para os EXTERNAL (9092-9094), que anunciam localhost -
  # dentro do container isso apontaria para o proprio container e a conexao morreria
  # no segundo passo do bootstrap (conectar no endereco ANUNCIADO pelo broker).
  kafka:
    bootstrap-servers: algashop-kafka-1:9090,algashop-kafka-2:9090,algashop-kafka-3:9090

algashop:
  integrations:
    shipping.provider: "RAPIDEX"
    rapidex.url: "http://wiremock:8080"
    # service ID no Eureka, nao nome de container: o builder e @LoadBalanced e o
    # host desta URL e resolvido no registry (o catalogo se registra como
    # "product-catalog"). O nome de container com porta quebraria o lookup.
    product-catalog.url: "http://product-catalog"