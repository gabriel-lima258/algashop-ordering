server.port: 8081

spring:
  cache:
    type: none
  cloud:
    discovery:
      client:
        simple:
          instances:
            product-catalog:
              - uri: http://localhost:8781
  datasource:
    url: jdbc:postgresql://localhost:5433/ordering_test
    username: postgres
    password: postgres
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'true'
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/clean
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/ordering_test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${algashop.integrations.authorization-server.url}
      # A registration abaixo NUNCA e usada: nenhum teste pede token de verdade - os *IT
      # trocam o JwtDecoder por mock, e a matriz de autorizacao injeta a autenticacao com
      # o post-processor jwt(). Ela existe porque o .oauth2Client() da OrderingSecurityConfig
      # faz a SecurityFilterChain EXIGIR um ClientRegistrationRepository, e o Spring so cria
      # esse bean quando ha ao menos uma registration configurada. Sem estas linhas o
      # contexto nao sobe e todo teste de fatia falha com NoSuchBeanDefinitionException.
      #
      # E ela e usada de verdade num caso: o RestClient do catalogo carrega o
      # OAuth2ClientHttpRequestInterceptor, entao TODO teste que chama o catalogo primeiro
      # pede um token. Por isso o token-uri aponta para o mesmo WireMock que finge ser o
      # catalogo (porta 8781, do AbstractPresentationIT), que serve o /oauth2/token pelo
      # mapping post-oauth2-token.json. O ResilientProductCatalogAPIClientIT sobe o proprio
      # WireMock em porta dinamica e sobrescreve esta propriedade.
      client:
        provider:
          algashop-as:
            token-uri: ${algashop.integrations.authorization-server.url}/oauth2/token
        registration:
          algashop-ordering-service-client:
            provider: algashop-as
            client-id: algashop-ordering-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: products:read
  kafka:
    properties:
      spring.json.type.mapping:
        ProductCatalog.ProductDelistedIntegrationEvent:com.gtech.algashop.core.application.product.event.ProductDelistedIntegrationEvent,
        ProductCatalog.ProductListedIntegrationEvent:com.gtech.algashop.core.application.product.event.ProductListedIntegrationEvent,
        ProductCatalog.ProductPriceChangedV2IntegrationEvent:com.gtech.algashop.core.application.product.event.ProductPriceChangedV2IntegrationEvent,
        ProductCatalog.ProductRestockedIntegrationEvent:com.gtech.algashop.core.application.product.event.ProductRestockedIntegrationEvent,
        ProductCatalog.ProductSoldOutIntegrationEvent:com.gtech.algashop.core.application.product.event.ProductSoldOutIntegrationEvent,
        Ordering.OrderPlacedIntegrationEvent:com.gtech.algashop.core.application.order.event.OrderPlacedIntegrationEvent,
        Ordering.OrderPaidIntegrationEvent:com.gtech.algashop.core.application.order.event.OrderPaidIntegrationEvent,
        Ordering.OrderCanceledIntegrationEvent:com.gtech.algashop.core.application.order.event.OrderCanceledIntegrationEvent,
        Ordering.OrderReadyIntegrationEvent:com.gtech.algashop.core.application.order.event.OrderReadyIntegrationEvent,
        Ordering.IssueInvoiceIntegrationCommand:com.gtech.algashop.core.application.invoice.command.IssueInvoiceIntegrationCommand
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 0
        request.timeout.ms: 4000
        delivery.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: ordering
      properties:
        max.poll.interval.ms: 300000 # 5 minutos ->
        max.poll.records: 500 # quantidade de registros buscados
        heartbeat.interval.ms: 3000 # 3 segundos
        #        max.poll.interval.ms: 10000
        #        max.poll.records: 1
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.gtech.algashop.*
        spring.json.key.default.type: java.lang.String
        spring.json.value.default.type: java.lang.String
        spring.json.value.type.method: com.gtech.algashop.infrastructure.config.kafka.KafkaConsumerTypeIdIdentifier.readType

eureka:
  client:
    enabled: false

algashop:
  integrations:
    authorization-server.url: http://auth.algashop.local:8081
    shipping.provider: FAKE
    rapidex.url: http://localhost:8780
    product-catalog:
      url: http://product-catalog
      oauth2-client-registration-id: algashop-ordering-service-client
  messaging:
    kafka:
      product-event-topic-name: product-catalog.product.events
      order-event-topic-name: ordering.order.events
      product-events-consumer-group: ordering.product-events
      billing-invoice-commands-topic-name: billing.invoice.commands
      saga-replies-topic-name: ordering.saga.replies
    outbox:
      enabled: true
      send-timeout: PT5S
      batch-size: 100
      poll-interval: PT1M #PT5S
      max-attempts: 10
      backoff: PT5S
      batch-deadline: PT3M
      dispatcher:
        enabled: false
